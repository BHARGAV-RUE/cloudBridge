# App
cloudbridge.base-url=http://localhost:8080
spring.application.name=cloudbridge
server.port=8080

# PostgreSQL
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver.class-name=

# JAP / Hibernate
spring.jpa.database-platform=
spring.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File upload limit
spring.servlet.multipart.max-file-size=5GB
spring.servlet.multipart.max-request-size=5GB

# AWS S3
aws.access-key=${}
aws.secret-key=${}
aws.region=
aws.bucket-name=${}

# Azure

# Scheduler timezone ? set to your server timezone
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=cloudbridge-scheduler-

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${}
spring.mail.password=${}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Sender display name
cloudbridge.email.from-name=CloudBridge
cloudbridge.email.from-address=${GMAIL_USERNAME}

# Frontend URL ? used in email links
cloudbridge.frontend-url=http://localhost:5173

# File Temp storage
cloudbridge.temp-dir=
cloudbridge.upload-dir=

# Link expiry
cloudbridge.default-expiry-hours=24

# Admin JWT
cloudbridge.admin.jwt-secret=${ADMIN_JWT_SECRET}
cloudbridge.admin.jwt-expiry-hours=24

# Admin credentials ? seeded on first run
cloudbridge.admin.username=${ADMIN_USERNAME}
cloudbridge.admin.password=${ADMIN_PASSWORD}
cloudbridge.admin.email=${ADMIN_EMAIL}